<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahesh Online Book Rental Management</title>
<style>
:root{--nv:#1b1745;--bg:#f4f2fb;--sf:#fff;--tx:#1c1a33;--mut:#6b6a85;--pri:#6d28d9;--acc:#f59e0b;--bd:#e6e3f3}
*{box-sizing:border-box}
body{margin:0;display:flex;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
aside{width:250px;flex:none;background:var(--nv);color:#b9b5e0;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.br{display:flex;gap:12px;align-items:center;color:#fff;margin:0 6px 26px}.br b{display:block;line-height:1.2}.br small{color:#a29de0;line-height:1.25;display:block}
.me{display:inline-grid;place-items:center;position:relative;border-radius:50%;overflow:hidden;background:var(--acc);color:var(--nv);font-weight:800;flex:none}
.me img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
aside .me{width:46px;height:46px;box-shadow:0 0 0 2px var(--acc)}
aside a{display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none;padding:10px 12px;border-radius:10px}
aside a:hover{background:#2a2570;color:#fff}aside a.on{background:linear-gradient(90deg,#7c3aed,#6d28d9);color:#fff;font-weight:600}
aside p{margin:auto 6px 0;font-size:.82rem;color:#a29de0}
main{flex:1;min-width:0;padding:28px 32px 48px;max-width:1150px}
h1{font-size:1.6rem;margin:0}h2{font-size:1.05rem;margin:0 0 14px}small{color:var(--mut)}
.ph{margin-bottom:20px}.ph p{margin:2px 0 0;color:var(--mut)}
.hero{display:flex;gap:26px;align-items:center;background:linear-gradient(120deg,#1b1745,#4c1d95 55%,#7c3aed);color:#fff;border-radius:20px;padding:30px 34px;position:relative;overflow:hidden;margin-bottom:20px;box-shadow:0 12px 30px #4c1d9540}
.hero .me{width:112px;height:112px;font-size:2.4rem;box-shadow:0 0 0 4px var(--acc),0 0 0 9px #ffffff22}
.hero small{color:#fcd34d;text-transform:uppercase;letter-spacing:.12em;font-size:.75rem;font-weight:700}
.hero h1{font-size:2rem;line-height:1.2;margin:4px 0 8px}.hero p{margin:0;color:#ddd6fe}
.hero svg{position:absolute;color:#fff;opacity:.09}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:20px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:20px}
.g3{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:20px}
.pn{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:0 2px 8px #1b174510}
.sc{display:flex;gap:14px;align-items:center}.sc b{font-size:1.7rem;line-height:1.1;display:block}
.ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.chart{display:flex;gap:14px;height:200px;align-items:end}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:4px;font-size:.78rem}
.col i{width:100%;max-width:46px;border-radius:8px 8px 0 0;background:linear-gradient(#a78bfa,#6d28d9)}.col:last-child i{background:linear-gradient(#fcd34d,#f59e0b)}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring span{background:var(--sf);width:86px;height:86px;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:700;line-height:1.1}
.lg{display:grid;gap:4px;font-size:.85rem}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.li>div{flex:1;min-width:0}.li b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc{width:38px;height:50px;border-radius:5px;flex:none;box-shadow:inset 4px 0 0 #0003}
.bar{height:7px;background:#ece8f8;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--pri)}
.tb{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.bk{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 8px #1b174510}.bk[hidden]{display:none}
.cv{height:170px;padding:18px 16px 14px 22px;color:#fff;display:flex;flex-direction:column;justify-content:end;box-shadow:inset 8px 0 0 #0003}
.cv b{font-size:1.05rem;line-height:1.25}.cv small{color:#ffffffcc}
.bb{padding:14px;display:flex;flex-direction:column;gap:6px}.rw{display:flex;justify-content:space-between;align-items:center}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:20px}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:3px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx)}
button{font:inherit;padding:8px 16px;border:0;border-radius:8px;background:var(--pri);color:#fff;cursor:pointer;font-weight:600}
button:hover{filter:brightness(.92)}:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:16px;margin-bottom:24px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:.85rem;background:#faf9ff}tr:last-child td{border:0}td.empty{color:var(--mut);white-space:normal}
.b{padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600;color:#fff}
.active,.Basic{background:#2563eb}.overdue{background:#dc2626}.returned{background:#64748b}.Premium{background:var(--acc);color:#1b1745}
.me.s{width:30px;height:30px;font-size:.8rem;vertical-align:middle;margin-right:8px;background:#ede9fe;color:var(--pri)}
@media(max-width:800px){body{flex-direction:column}aside{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px}.br,aside p{display:none}main{padding:18px}.g3{grid-template-columns:1fr}.hero{flex-direction:column;text-align:center}}
</style>
</head>

const P={grid:'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z',book:'M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5zM4 19.5V22h16',users:'M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8',repeat:'M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3',alert:'M12 3l10 18H2zM12 10v5M12 18h.01',rupee:'M6 3h12M6 8h12M6 13l8.5 8M6 13h3a4 4 0 000-10',clock:'M12 22a10 10 0 100-20 10 10 0 000 20zM12 6v6l4 2'};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;
const CC={Fiction:'#7c3aed',Biography:'#0891b2','Self-help':'#db2777',Finance:'#059669',Technology:'#2563eb',History:'#b45309',Fantasy:'#9333ea'},col=c=>CC[c]||'#475569';
const iso=d=>new Date(Date.now()+d*864e5).toISOString().slice(0,10),today=()=>iso(0),diff=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const B=[['The Alchemist','Paulo Coelho','Fiction',6,25,4.6],['Wings of Fire','A.P.J. Abdul Kalam','Biography',5,20,4.8],['Atomic Habits','James Clear','Self-help',8,30,4.7],['Rich Dad Poor Dad','Robert Kiyosaki','Finance',6,25,4.4],['The Psychology of Money','Morgan Housel','Finance',5,30,4.6],['Clean Code','Robert C. Martin','Technology',4,40,4.5],['Sapiens','Yuval Noah Harari','History',5,35,4.5],['The Godfather','Mario Puzo','Fiction',3,25,4.4],['Ikigai','Hector Garcia','Self-help',7,20,4.2],['Python Crash Course','Eric Matthes','Technology',4,40,4.6],['The Immortals of Meluha','Amish Tripathi','Fantasy',5,25,4.1],['Harry Potter, Book 1','J.K. Rowling','Fantasy',6,30,4.9]];
function seed(){const rentals=[];for(let i=0;i<26;i++){const w=i<3?1:1+i%3,o=-(i*7+2);rentals.push({id:i+1,bid:(i*5)%12+1,mid:i%6+1,out:iso(o),due:iso(o+w*7),weeks:w,ret:i<3?null:iso(o+w*7+(i%4==0?2:0))})}
 return{books:B.map((b,i)=>({id:i+1,title:b[0],author:b[1],category:b[2],copies:b[3],price:b[4],rating:b[5]})),members:[['Ravi Kumar','ravi@mail.com','98480 11111','Premium'],['Sneha Reddy','sneha@mail.com','98480 22222','Basic'],['Pradeep','pradeep@mail.com','98480 33333','Premium'],['Rony','rony@mail.com','98480 44444','Basic'],['Anitha','anitha@mail.com','98480 55555','Premium'],['Kiran','kiran@mail.com','98480 66666','Basic']].map((m,i)=>({id:i+1,name:m[0],email:m[1],phone:m[2],plan:m[3]})),rentals,seq:100}}
let db=null;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}db=db||seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const bk=i=>db.books.find(b=>b.id==i),mb=i=>db.members.find(m=>m.id==i),nid=()=>db.seq++;
const act=b=>db.rentals.filter(r=>r.bid==b.id&&!r.ret).length,st=r=>r.ret?'returned':r.due<today()?'overdue':'active';
const late=r=>Math.max(0,diff(r.ret||today(),r.due))*5,fee=r=>bk(r.bid).price*r.weeks+late(r);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),val=i=>document.getElementById(i).value.trim();
const sum=(a,k)=>a.reduce((n,x)=>n+x[k],0),rs=n=>'\u20B9'+n.toLocaleString('en-IN');
const badge=s=>`<span class="b ${s}">${s}</span>`,opts=(l,f)=>l.map(x=>`<option value="${x.id??x}">${f?f(x):x}</option>`).join('');
const ph=(t,s)=>`<div class="ph"><h1>${t}</h1><p>${s}</p></div>`;
const table=(h,r,m)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.length?r.map(c=>`<tr>${c.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td class="empty" colspan="${h.length}">${m||'Nothing here yet.'}</td></tr>`}</table></div>`;
const me=(c,x='')=>`<span class="me ${x}">${c}${x?'':`<img src="${PHOTO}" alt="Mahesh" onerror="this.remove()">`}</span>`;
const stat=(n,l,v,g)=>`<div class="pn sc"><div class="ic" style="background:${g}">${ic(n,24)}</div><div><b>${v}</b><small>${l}</small></div></div>`;
const nav=[['index','Dashboard','grid'],['books','Books','book'],['members','Members','users'],['rentals','Rent and return','repeat']];
const V={
index(){const R=db.rentals,A=R.filter(r=>!r.ret),od=A.filter(r=>st(r)=='overdue'),rev=R.reduce((n,r)=>n+fee(r),0),now=new Date();
 const M=[...Array(6)].map((_,k)=>{const d=new Date(now.getFullYear(),now.getMonth()-5+k,1),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return{l:d.toLocaleString('en',{month:'short'}),v:R.filter(r=>r.out.slice(0,7)==key).reduce((n,r)=>n+fee(r),0)}}),mx=Math.max(1,...M.map(m=>m.v));
 const cats=[...new Set(db.books.map(b=>b.category))].map(c=>({c,n:sum(db.books.filter(b=>b.category==c),'copies')})),tot=sum(cats,'n');let a=0;
 const stops=cats.map(c=>{const s=a;a+=c.n/tot*100;return `${col(c.c)} ${s}% ${a}%`}).join(',');
 const top=db.books.map(b=>({b,n:R.filter(r=>r.bid==b.id).length})).sort((x,y)=>y.n-x.n).slice(0,5),tn=top[0].n||1;
 const rec=[...R].sort((x,y)=>y.out.localeCompare(x.out)||y.id-x.id).slice(0,5);
 return `<div class="hero">${me('M')}<div><small>Welcome back, Mahesh</small><h1>Mahesh Online Book Rental Management</h1><p>${now.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}. ${A.length} books are out on rent and ${od.length} are overdue.</p></div><svg style="right:30px;top:-18px" width="170" height="170" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="${P.book}"/></svg><svg style="right:190px;bottom:-34px" width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="${P.book}"/></svg></div>
 <div class="g4">${stat('book','Book copies',sum(db.books,'copies'),'linear-gradient(135deg,#8b5cf6,#6d28d9)')}${stat('repeat','Rented out now',A.length,'linear-gradient(135deg,#38bdf8,#2563eb)')}${stat('alert','Overdue',od.length,'linear-gradient(135deg,#fb7185,#dc2626)')}${stat('rupee','Total revenue',rs(rev),'linear-gradient(135deg,#fbbf24,#f59e0b)')}</div>
 <div class="g3"><div class="pn"><h2>Revenue, last 6 months</h2><div class="chart">${M.map(m=>`<div class="col"><span>${rs(m.v)}</span><i style="height:${Math.max(3,m.v/mx*78)}%"></i><small>${m.l}</small></div>`).join('')}</div></div>
 <div class="pn"><h2>Books by category</h2><div class="dn"><div class="ring" style="background:conic-gradient(${stops})"><span>${db.books.length}<br><small>titles</small></span></div><div class="lg">${cats.map(c=>`<div><i style="background:${col(c.c)}"></i>${c.c} (${c.n})</div>`).join('')}</div></div></div></div>
 <div class="g2"><div class="pn"><h2>Most rented books</h2>${top.map(t=>`<div class="li"><div class="mc" style="background:${col(t.b.category)}"></div><div><b>${t.b.title}</b><div class="bar"><i style="width:${t.n/tn*100}%;background:${col(t.b.category)}"></i></div></div><small>${t.n} rentals</small></div>`).join('')}</div>
 <div class="pn"><h2>Recent rentals</h2>${rec.map(r=>`<div class="li"><div><b>${bk(r.bid).title}</b><small>${mb(r.mid).name}, ${r.out}</small></div>${badge(st(r))}</div>`).join('')}</div></div>
 <h2>Overdue returns</h2>`+table(['Member','Book','Due','Late fee'],od.map(r=>[mb(r.mid).name,bk(r.bid).title,r.due,rs(late(r))]),'No overdue books. Great!')+`<button onclick="resetDb()" style="background:#fff;color:var(--tx);border:1px solid var(--bd)">Reset sample data</button>`},
books(){const cats=[...new Set(db.books.map(b=>b.category))];
 return ph('Books','Browse the catalogue and add new titles.')+`<form onsubmit="return addBook()"><label>Title<input id="t" required></label><label>Author<input id="a" required></label><label>Category<input id="c" list="cl" required></label><datalist id="cl">${cats.map(c=>`<option>${c}</option>`).join('')}</datalist><label>Copies<input id="n" type="number" min="1" value="3" style="width:80px"></label><label>Rent per week (\u20B9)<input id="p" type="number" min="1" value="25" style="width:110px"></label><button>Add book</button></form>
 <div class="tb"><input id="s" placeholder="Search title or author" oninput="filt()"><select id="cf" onchange="filt()"><option value="">All categories</option>${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="cards">${db.books.map(b=>{const c=col(b.category),av=b.copies-act(b);return `<div class="bk" data-t="${(b.title+b.author).toLowerCase()}" data-c="${b.category}"><div class="cv" style="background:linear-gradient(135deg,${c},${c}aa)"><b>${b.title}</b><small>${b.author}</small></div><div class="bb"><div class="rw"><small>${b.category}</small><b>\u2605 ${b.rating}</b></div><div class="rw"><b>${rs(b.price)}<small> / week</small></b>${badge(av>0?'active':'overdue').replace('>active<','>in stock<').replace('>overdue<','>out<')}</div><div class="bar"><i style="width:${av/b.copies*100}%"></i></div><small>${av} of ${b.copies} copies available</small></div></div>`}).join('')}</div>`},
members(){return ph('Members','People who rent books from the library.')+`<form onsubmit="return addMem()"><label>Name<input id="n" required></label><label>Email<input id="e" type="email" required></label><label>Phone<input id="p"></label><label>Plan<select id="l"><option>Basic</option><option>Premium</option></select></label><button>Add member</button></form>`+table(['Member','Email','Phone','Plan','Renting now','Total rentals','Spent'],db.members.map(m=>{const r=db.rentals.filter(x=>x.mid==m.id);return [me(m.name[0],'s')+m.name,m.email,m.phone,badge(m.plan),r.filter(x=>!x.ret).length,r.length,rs(r.reduce((n,x)=>n+fee(x),0))]}))},
rentals(){return ph('Rent and return','Give a book to a member and record when it comes back. Late fee is \u20B95 per day.')+`<form onsubmit="return rent()"><label>Member<select id="m">${opts(db.members,m=>m.name)}</select></label><label>Book<select id="b">${opts(db.books,b=>`${b.title} (${b.copies-act(b)} free)`)}</select></label><label>Weeks<select id="w"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><button>Rent book</button></form>`+table(['ID','Member','Book','Rented','Due','Fee','Status','Action'],[...db.rentals].sort((x,y)=>y.out.localeCompare(x.out)||y.id-x.id).map(r=>[r.id,mb(r.mid).name,bk(r.bid).title,r.out,r.due,rs(fee(r)),badge(st(r)),r.ret?r.ret:`<button onclick="giveBack(${r.id})">Return</button>`]))}};
function render(){if(!V[pg])pg='index';document.body.innerHTML=`<aside><div class="br">${me('M')}<div><b>Mahesh</b><small>Online Book Rental Management</small></div></div>${nav.map(n=>`<a href="#${n[0]}" class="${n[0]==pg?'on':''}">${ic(n[2])}${n[1]}</a>`).join('')}<p>Signed in as<br><b style="color:#fff">Mahesh (Owner)</b></p></aside><main>${V[pg]()}</main>`}
const done=()=>{save();render()};
function filt(){const v=val('s').toLowerCase(),c=val('cf');document.querySelectorAll('.bk').forEach(x=>x.hidden=!(x.dataset.t.includes(v)&&(!c||x.dataset.c==c)))}
function addBook(){db.books.push({id:nid(),title:esc(val('t')),author:esc(val('a')),category:esc(val('c')),copies:+val('n'),price:+val('p'),rating:4});done();return false}
function addMem(){db.members.push({id:nid(),name:esc(val('n')),email:esc(val('e')),phone:esc(val('p')),plan:val('l')});done();return false}
function rent(){const b=bk(val('b')),w=+val('w');if(b.copies-act(b)<1){alert('No copies of '+b.title+' are available right now.');return false}
 db.rentals.push({id:nid(),bid:b.id,mid:+val('m'),out:today(),due:iso(w*7),weeks:w,ret:null});done();return false}
function giveBack(i){db.rentals.find(r=>r.id==i).ret=today();done()}
function resetDb(){try{localStorage.removeItem(K)}catch(e){}db=seed();render()}
render();
window.addEventListener('hashchange',()=>{pg=location.hash.slice(1)||'index';render();window.scrollTo(0,0)});
</script>
